<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>加法器</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      padding: 32px;
      width: 100%;
      max-width: 400px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .calculator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 24px 0;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input[type="text"] {
      width: 120px;
      height: 44px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 12px;
      font-size: 16px;
      font-family: inherit;
      color: #1a1a1a;
      background: #ffffff;
      transition: all 150ms ease-out;
      outline: none;
    }

    input[type="text"]:hover {
      border-color: #9ca3af;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    input[type="text"]:active {
      border-color: #6b7280;
      transform: translateY(1px);
    }

    input[type="text"]:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    input[type="text"].error {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .operator, .equals {
      font-size: 24px;
      font-weight: 600;
      color: #666;
      user-select: none;
    }

    #result {
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      min-width: 80px;
      text-align: center;
      transition: color 150ms ease-out;
    }

    #result.error {
      color: #dc2626;
      animation: shake 300ms ease-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-4px); }
      75%       { transform: translateX(4px); }
    }

    .hint {
      text-align: center;
      font-size: 14px;
      color: #666;
    }

    .error-icon {
      display: none;
    }

    #result.error + .error-icon,
    .error-icon.visible {
      display: inline;
    }

    @media (max-width: 480px) {
      .container {
        max-width: 100%;
        padding: 24px 16px;
        border-radius: 8px;
        margin: 16px;
      }
      input[type="text"] {
        width: 100px;
      }
      .calculator {
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>加法器</h1>
    <div class="calculator">
      <label for="a" class="sr-only">第一个数字</label>
      <input id="a" type="text" inputmode="decimal" aria-label="第一个数字" />
      <span class="operator">+</span>
      <label for="b" class="sr-only">第二个数字</label>
      <input id="b" type="text" inputmode="decimal" aria-label="第二个数字" />
      <span class="equals">=</span>
      <span id="result" aria-live="polite" aria-atomic="true">0</span>
      <span class="error-icon" aria-hidden="true">&#x2715;</span>
    </div>
    <p class="hint">输入数字，实时计算</p>
  </div>

  <script>
    const VALIDATION_REGEX = /^-?\d*\.?\d*$/;

    const inputA = document.getElementById('a');
    const inputB = document.getElementById('b');
    const resultEl = document.getElementById('result');
    const errorIcon = document.querySelector('.error-icon');


    const inputA = document.getElementById('a');
    const inputB = document.getElementById('b');
    const resultEl = document.getElementById('result');
    const errorIcon = document.querySelector('.error-icon');

    function validate(value) {
      if (value === '') return true;
      if (!VALIDATION_REGEX.test(value)) return false;
      const parsed = parseFloat(value);
      if (isNaN(parsed)) return false;
      // Ensure parseFloat consumed the entire string (not just a numeric prefix)
      return String(parsed) === value;
    }

    function calculate(a, b) {
      return Number((a + b).toFixed(10));
    }

    function showResult(value) {
      resultEl.textContent = value;
      resultEl.classList.remove('error');
      inputA.classList.remove('error');
      inputB.classList.remove('error');
      errorIcon.classList.remove('visible');
    }

    function showError() {
      resultEl.textContent = '×';
      resultEl.classList.add('error');
      inputA.classList.add('error');
      inputB.classList.add('error');
      errorIcon.classList.add('visible');
    }

    function handleInput() {
      const aVal = inputA.value;
      const bVal = inputB.value;

      if (!validate(aVal) || !validate(bVal)) {
        showError();
        return;
      }

      const a = aVal === '' ? 0 : parseFloat(aVal);
      const b = bVal === '' ? 0 : parseFloat(bVal);

      if (isNaN(a) || isNaN(b)) {
        showError();
        return;
      }

      showResult(calculate(a, b));
    }

    inputA.addEventListener('input', handleInput);
    inputB.addEventListener('input', handleInput);
  </script>
</body>
</html>
