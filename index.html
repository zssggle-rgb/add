<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>加法器</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #202124;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ── Header with settings icon ── */
    .header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 20px;
      gap: 16px;
      flex-shrink: 0;
    }

    .header-link {
      font-size: 13px;
      color: #5f6368;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 4px;
      transition: background 150ms ease;
    }

    .header-link:hover {
      background: #f1f3f4;
    }

    /* ── Main content centered ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: -80px;
    }

    /* ── Logo area ── */
    .logo {
      font-size: 88px;
      font-weight: 500;
      letter-spacing: -2px;
      margin-bottom: 28px;
      user-select: none;
      line-height: 1;
    }

    .logo .g-blue { color: #4285f4; }
    .logo .g-red { color: #ea4335; }
    .logo .g-yellow { color: #fbbc05; }
    .logo .g-green { color: #34a853; }

    /* ── Calculator section (Google search box style) ── */
    .calculator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 140px;
      height: 44px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      padding: 0 16px;
      font-size: 16px;
      font-family: inherit;
      color: #202124;
      background: #ffffff;
      transition: all 150ms ease-out;
      outline: none;
      box-shadow: none;
    }

    input[type="text"]:hover {
      border-color: #c0c0c0;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.18);
    }

    input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    input[type="text"]:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    input[type="text"]:active {
      border-color: #6b7280;
      transform: translateY(1px);
    }

    input[type="text"].error {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .operator, .equals {
      font-size: 22px;
      font-weight: 600;
      color: #5f6368;
      user-select: none;
    }

    /* ── Result display ── */
    #result {
      font-size: 28px;
      font-weight: 700;
      color: #202124;
      min-width: 60px;
      text-align: center;
      transition: color 150ms ease-out;
      cursor: text;
      user-select: text;
    }

    #result.error {
      color: #dc2626;
      animation: shake 300ms ease-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-4px); }
      75%       { transform: translateX(4px); }
    }

    .error-icon {
      display: none;
    }

    #result.error + .error-icon,
    .error-icon.visible {
      display: inline;
    }

    /* ── Buttons (Google search style) ── */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      height: 36px;
      padding: 0 16px;
      border: none;
      border-radius: 4px;
      background: #f8f9fa;
      color: #3c4043;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: all 150ms ease;
      line-height: 36px;
      user-select: none;
    }

    .btn:hover {
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.24);
      border: 1px solid #dadce0;
      padding: 0 15px;
    }

    .btn:active {
      background: #e8eaed;
      box-shadow: none;
    }

    /* ── Hint text ── */
    .hint {
      text-align: center;
      font-size: 13px;
      color: #70757a;
    }

    /* ── Footer ── */
    .footer {
      background: #f2f2f2;
      border-top: 1px solid #dadce0;
      padding: 15px 30px;
      flex-shrink: 0;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .footer-link {
      font-size: 13px;
      color: #70757a;
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 150ms ease;
    }

    .footer-link:hover {
      background: #e8eaed;
      color: #202124;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .main {
        margin-top: -40px;
        padding: 0 16px;
      }

      .logo {
        font-size: 60px;
        margin-bottom: 20px;
      }

      .calculator {
        gap: 6px;
      }

      input[type="text"] {
        width: 80px;
        height: 40px;
        padding: 0 10px;
        font-size: 15px;
      }

      .operator, .equals {
        font-size: 18px;
      }

      #result {
        font-size: 22px;
        min-width: 40px;
      }

      .buttons {
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .header {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <a class="header-link" href="#" tabindex="-1">Gmail</a>
    <a class="header-link" href="#" tabindex="-1">图片</a>
  </div>

  <!-- Main content -->
  <div class="main">
    <h1 class="logo"><span class="g-blue">加</span><span class="g-red">法</span><span class="g-yellow">器</span></h1>

    <div class="calculator">
      <label for="a" class="sr-only">第一个数字</label>
      <input id="a" type="text" inputmode="decimal" aria-label="第一个数字" />
      <span class="operator">+</span>
      <label for="b" class="sr-only">第二个数字</label>
      <input id="b" type="text" inputmode="decimal" aria-label="第二个数字" />
      <span class="equals">=</span>
      <span id="result" aria-live="polite" aria-atomic="true">0</span>
      <span class="error-icon" aria-hidden="true">&#x2715;</span>
    </div>

    <div class="buttons">
      <button type="button" class="btn" onclick="handleInput()">Google 计算</button>
    </div>

    <p class="hint">输入数字，实时计算</p>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-links">
      <a class="footer-link" href="#">关于</a>
      <a class="footer-link" href="#">广告</a>
      <a class="footer-link" href="#">隐私权</a>
      <a class="footer-link" href="#">条款</a>
    </div>
  </div>

  <script>
    const VALIDATION_REGEX = /^-?\d*\.?\d*$/;

    const inputA = document.getElementById('a');
    const inputB = document.getElementById('b');
    const resultEl = document.getElementById('result');
    const errorIcon = document.querySelector('.error-icon');

    function validate(value) {
      if (value === '') return true;
      if (!VALIDATION_REGEX.test(value)) return false;
      const parsed = parseFloat(value);
      if (isNaN(parsed)) return false;
      // Ensure parseFloat consumed the entire string (not just a numeric prefix)
      return String(parsed) === value;
    }

    function calculate(a, b) {
      return Number((a + b).toFixed(10));
    }

    function showResult(value) {
      resultEl.textContent = value;
      resultEl.classList.remove('error');
      inputA.classList.remove('error');
      inputB.classList.remove('error');
      errorIcon.classList.remove('visible');
    }

    function showError() {
      resultEl.textContent = '×';
      resultEl.classList.add('error');
      inputA.classList.add('error');
      inputB.classList.add('error');
      errorIcon.classList.add('visible');
    }

    function selectResultText() {
      const selection = window.getSelection();
      if (!selection) return;
      const range = document.createRange();
      range.selectNodeContents(resultEl);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function handleInput() {
      const aVal = inputA.value;
      const bVal = inputB.value;

      if (!validate(aVal) || !validate(bVal)) {
        showError();
        return;
      }

      const a = aVal === '' ? 0 : parseFloat(aVal);
      const b = bVal === '' ? 0 : parseFloat(bVal);

      if (isNaN(a) || isNaN(b)) {
        showError();
        return;
      }

      showResult(calculate(a, b));
    }

    inputA.addEventListener('input', handleInput);
    inputB.addEventListener('input', handleInput);
    resultEl.addEventListener('dblclick', selectResultText);
  </script>
</body>
</html>
